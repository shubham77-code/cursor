<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chronos — Scroll to Disassemble</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="progress-bar"></div>

<div id="scroll-track">
  <div id="stage">
    <canvas id="bg-canvas"></canvas>

    <div id="watch-wrap">
      <!-- Layers rendered bottom-to-top (paint order = z-order) -->

      <!-- 0: Case back + lugs -->
      <div class="watch-layer" id="layer-caseback">
        <svg width="320" height="380" viewBox="0 0 320 380" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Top lugs -->
          <rect x="108" y="8"  width="34" height="54" rx="11" fill="#2e2e3c" stroke="#555568" stroke-width="1.5"/>
          <rect x="178" y="8"  width="34" height="54" rx="11" fill="#2e2e3c" stroke="#555568" stroke-width="1.5"/>
          <!-- Bottom lugs -->
          <rect x="108" y="318" width="34" height="54" rx="11" fill="#2e2e3c" stroke="#555568" stroke-width="1.5"/>
          <rect x="178" y="318" width="34" height="54" rx="11" fill="#2e2e3c" stroke="#555568" stroke-width="1.5"/>
          <!-- Case body -->
          <circle cx="160" cy="190" r="132" fill="url(#caseGrad)" stroke="#4a4a5a" stroke-width="2.5"/>
          <circle cx="160" cy="190" r="124" fill="#1a1a24" stroke="#363648" stroke-width="1"/>
          <!-- Brushed lines on case -->
          <line x1="88"  y1="150" x2="88"  y2="230" stroke="#3a3a4a" stroke-width=".7"/>
          <line x1="232" y1="150" x2="232" y2="230" stroke="#3a3a4a" stroke-width=".7"/>
          <!-- Screw holes -->
          <circle cx="112" cy="148" r="5" fill="#0e0e18" stroke="#4a4a5a" stroke-width="1"/>
          <circle cx="208" cy="148" r="5" fill="#0e0e18" stroke="#4a4a5a" stroke-width="1"/>
          <circle cx="112" cy="232" r="5" fill="#0e0e18" stroke="#4a4a5a" stroke-width="1"/>
          <circle cx="208" cy="232" r="5" fill="#0e0e18" stroke="#4a4a5a" stroke-width="1"/>
          <!-- Engraving -->
          <text x="160" y="194" text-anchor="middle" font-size="9" fill="#3a3a4a" font-family="Georgia" letter-spacing="2.5">STAINLESS STEEL</text>
          <text x="160" y="207" text-anchor="middle" font-size="7.5" fill="#2e2e3a" font-family="Georgia" letter-spacing="2">316L · SWISS</text>
          <defs>
            <radialGradient id="caseGrad" cx="35%" cy="30%" r="75%">
              <stop offset="0%"   stop-color="#3a3a4a"/>
              <stop offset="60%"  stop-color="#252530"/>
              <stop offset="100%" stop-color="#16161e"/>
            </radialGradient>
          </defs>
        </svg>
      </div>

      <!-- 1: Movement mainplate -->
      <div class="watch-layer" id="layer-movement">
        <svg width="252" height="252" viewBox="0 0 252 252" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Base plate -->
          <circle cx="126" cy="126" r="120" fill="url(#mvtGrad)" stroke="#7a7040" stroke-width="1.5"/>
          <circle cx="126" cy="126" r="114" fill="none" stroke="#5a5030" stroke-width=".8"/>
          <!-- Cotes de Genève lines (parallel streaks) -->
          <g stroke="#5a5830" stroke-width=".6" opacity=".4">
            <line x1="30"  y1="60"  x2="222" y2="60"/>
            <line x1="20"  y1="74"  x2="232" y2="74"/>
            <line x1="14"  y1="88"  x2="238" y2="88"/>
            <line x1="10"  y1="102" x2="242" y2="102"/>
            <line x1="8"   y1="116" x2="244" y2="116"/>
            <line x1="8"   y1="130" x2="244" y2="130"/>
            <line x1="10"  y1="144" x2="242" y2="144"/>
            <line x1="14"  y1="158" x2="238" y2="158"/>
            <line x1="20"  y1="172" x2="232" y2="172"/>
            <line x1="30"  y1="186" x2="222" y2="186"/>
          </g>
          <!-- Barrel bridge -->
          <path d="M46 82 Q66 56 166 62 Q206 68 216 110 Q212 148 196 164 Q166 196 96 192 Q56 186 46 156 Z"
                fill="#2a2818" stroke="#7a7040" stroke-width="1" opacity=".9"/>
          <!-- Gear train: center wheel -->
          <circle cx="126" cy="126" r="24" fill="#1e1c10" stroke="#9a8a48" stroke-width="2"/>
          <circle cx="126" cy="126" r="18" fill="#1a1810" stroke="#7a7040" stroke-width="1"/>
          <circle cx="126" cy="126" r="6"  fill="#c9a84c"/>
          <!-- Gear teeth (center) -->
          <g stroke="#9a8a48" stroke-width="1.2">
            <line x1="126" y1="100" x2="126" y2="104"/>
            <line x1="126" y1="148" x2="126" y2="152"/>
            <line x1="100" y1="126" x2="104" y2="126"/>
            <line x1="148" y1="126" x2="152" y2="126"/>
            <line x1="108" y1="108" x2="111" y2="111"/>
            <line x1="141" y1="141" x2="144" y2="144"/>
            <line x1="141" y1="108" x2="144" y2="111"/>
            <line x1="108" y1="141" x2="111" y2="144"/>
          </g>
          <!-- Satellite wheels -->
          <circle cx="82"  cy="90"  r="16" fill="#1a1810" stroke="#8a7a40" stroke-width="1.5"/>
          <circle cx="82"  cy="90"  r="8"  fill="#222018" stroke="#6a6030" stroke-width="1"/>
          <circle cx="82"  cy="90"  r="3"  fill="#c9a84c"/>
          <circle cx="170" cy="90"  r="14" fill="#1a1810" stroke="#8a7a40" stroke-width="1.5"/>
          <circle cx="170" cy="90"  r="7"  fill="#222018"/>
          <circle cx="170" cy="90"  r="3"  fill="#c9a84c"/>
          <circle cx="82"  cy="162" r="14" fill="#1a1810" stroke="#8a7a40" stroke-width="1.5"/>
          <circle cx="82"  cy="162" r="7"  fill="#222018"/>
          <circle cx="82"  cy="162" r="3"  fill="#c9a84c"/>
          <circle cx="170" cy="162" r="16" fill="#1a1810" stroke="#8a7a40" stroke-width="1.5"/>
          <circle cx="170" cy="162" r="8"  fill="#222018" stroke="#6a6030" stroke-width="1"/>
          <circle cx="170" cy="162" r="3"  fill="#c9a84c"/>
          <!-- Escapement wheel -->
          <circle cx="148" cy="70" r="12" fill="#1a1810" stroke="#8a7a40" stroke-width="1.2"/>
          <circle cx="148" cy="70" r="5"  fill="#222018"/>
          <circle cx="148" cy="70" r="2"  fill="#c9a84c"/>
          <!-- Jewels (rubies) -->
          <circle cx="126" cy="126" r="4.5" fill="#cc2020" opacity=".95"/>
          <circle cx="82"  cy="90"  r="3"   fill="#cc2020" opacity=".9"/>
          <circle cx="170" cy="90"  r="3"   fill="#cc2020" opacity=".9"/>
          <circle cx="82"  cy="162" r="3"   fill="#cc2020" opacity=".9"/>
          <circle cx="170" cy="162" r="3"   fill="#cc2020" opacity=".9"/>
          <circle cx="148" cy="70"  r="2.5" fill="#cc2020" opacity=".9"/>
          <!-- Cal number -->
          <text x="126" y="132" text-anchor="middle" font-size="6.5" fill="#5a5030" font-family="Georgia" letter-spacing="1.5">CAL. 9001</text>
          <defs>
            <radialGradient id="mvtGrad" cx="40%" cy="35%" r="70%">
              <stop offset="0%"   stop-color="#302e1a"/>
              <stop offset="100%" stop-color="#1a1810"/>
            </radialGradient>
          </defs>
        </svg>
      </div>

      <!-- 2: Mainspring barrel -->
      <div class="watch-layer" id="layer-barrel">
        <svg width="110" height="110" viewBox="0 0 110 110" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="55" cy="55" r="50" fill="#1c1810" stroke="#9a8a40" stroke-width="2.5"/>
          <circle cx="55" cy="55" r="42" fill="#181610" stroke="#6a6030" stroke-width="1"/>
          <!-- Coil suggestion -->
          <path d="M55 16 A39 39 0 0 1 94 55 A39 39 0 0 1 55 94 A39 39 0 0 1 16 55 A39 39 0 0 1 55 16"
                stroke="#9a8040" stroke-width="1.8" fill="none" stroke-dasharray="5 3"/>
          <path d="M55 23 A32 32 0 0 1 87 55 A32 32 0 0 1 55 87 A32 32 0 0 1 23 55 A32 32 0 0 1 55 23"
                stroke="#7a6838" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/>
          <path d="M55 30 A25 25 0 0 1 80 55 A25 25 0 0 1 55 80 A25 25 0 0 1 30 55 A25 25 0 0 1 55 30"
                stroke="#5a5030" stroke-width=".8" fill="none" stroke-dasharray="3 3"/>
          <circle cx="55" cy="55" r="10" fill="#2a2418" stroke="#9a8a40" stroke-width="1.5"/>
          <circle cx="55" cy="55" r="4"  fill="#c9a84c"/>
        </svg>
      </div>

      <!-- 3: Rotor (oscillating weight) -->
      <div class="watch-layer" id="layer-rotor">
        <svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M100 100 L100 20 A80 80 0 0 1 180 100 Z" fill="url(#rotorGrad)" stroke="#7a7088" stroke-width="1.2"/>
          <circle cx="100" cy="100" r="12" fill="#2a2838" stroke="#888898" stroke-width="1.5"/>
          <circle cx="100" cy="100" r="5"  fill="#c9a84c"/>
          <text x="138" y="68" text-anchor="middle" font-size="8" fill="#555568" font-family="Georgia"
                transform="rotate(-45 138 68)" letter-spacing="1">21600</text>
          <defs>
            <radialGradient id="rotorGrad" cx="60%" cy="40%" r="70%">
              <stop offset="0%"   stop-color="#4a4858"/>
              <stop offset="100%" stop-color="#18181e"/>
            </radialGradient>
          </defs>
        </svg>
      </div>

      <!-- 4: Dial -->
      <div class="watch-layer" id="layer-dial">
        <svg width="238" height="238" viewBox="0 0 238 238" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Dial base -->
          <circle cx="119" cy="119" r="108" fill="url(#dialGrad)"/>
          <!-- Sunburst lines radiating from center -->
          <g id="sunburst" stroke="#242438" stroke-width=".35" opacity=".6"></g>
          <!-- Dial chapter ring -->
          <circle cx="119" cy="119" r="100" fill="none" stroke="#c9a84c" stroke-width=".7" opacity=".4"/>
          <!-- Hour markers & minute markers generated in JS -->
          <g id="hour-markers"></g>
          <g id="min-markers"></g>
          <!-- Brand -->
          <text x="119" y="79"  text-anchor="middle" font-size="10.5" fill="#c9a84c"
                font-family="Georgia" letter-spacing="4.5" font-weight="400">CHRONOS</text>
          <text x="119" y="92"  text-anchor="middle" font-size="6.5"  fill="#8888a0"
                font-family="Georgia" letter-spacing="3">GENÈVE</text>
          <!-- Sub-seconds ring -->
          <circle cx="119" cy="150" r="20" fill="none" stroke="#555568" stroke-width=".8" opacity=".7"/>
          <g id="sub-second-ticks"></g>
          <text x="119" y="153" text-anchor="middle" font-size="5.5" fill="#555568"
                font-family="Georgia" letter-spacing="1">60</text>
          <defs>
            <radialGradient id="dialGrad" cx="42%" cy="36%" r="72%">
              <stop offset="0%"   stop-color="#282838"/>
              <stop offset="100%" stop-color="#0c0c16"/>
            </radialGradient>
          </defs>
        </svg>
      </div>

      <!-- 5: Hour hand -->
      <div class="watch-layer" id="layer-hour">
        <svg width="238" height="238" viewBox="0 0 238 238" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g id="hour-hand-g" transform="rotate(30 119 119)">
            <!-- Sword-shaped hand -->
            <polygon points="119,44 123.5,119 119,130 114.5,119" fill="#e8e0d0"/>
            <polygon points="119,44 122,62 119,66 116,62" fill="url(#handLumeGrad)"/>
            <polygon points="119,130 123,148 119,152 115,148" fill="#c9a84c"/>
            <circle cx="119" cy="119" r="7" fill="#c9a84c" stroke="#e8e0d0" stroke-width="1.5"/>
          </g>
          <defs>
            <linearGradient id="handLumeGrad" x1="119" y1="44" x2="119" y2="66" gradientUnits="userSpaceOnUse">
              <stop offset="0%"   stop-color="#d0e8c0"/>
              <stop offset="100%" stop-color="#e8e0d0"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <!-- 6: Minute hand -->
      <div class="watch-layer" id="layer-minute">
        <svg width="238" height="238" viewBox="0 0 238 238" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g id="minute-hand-g" transform="rotate(150 119 119)">
            <polygon points="119,24 123,119 119,130 115,119" fill="#e8e0d0"/>
            <polygon points="119,24 122,44 119,50 116,44" fill="url(#handLumeGrad2)"/>
            <polygon points="119,130 122.5,148 119,152 115.5,148" fill="#888898"/>
            <circle cx="119" cy="119" r="5.5" fill="#888898" stroke="#e8e0d0" stroke-width="1.2"/>
          </g>
          <defs>
            <linearGradient id="handLumeGrad2" x1="119" y1="24" x2="119" y2="50" gradientUnits="userSpaceOnUse">
              <stop offset="0%"   stop-color="#d0e8c0"/>
              <stop offset="100%" stop-color="#e8e0d0"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <!-- 7: Second hand -->
      <div class="watch-layer" id="layer-second">
        <svg width="238" height="238" viewBox="0 0 238 238" fill="none" xmlns="http://www.w3.org/2000/svg">
          <g id="second-hand-g">
            <line x1="119" y1="24"  x2="119" y2="152" stroke="#e02828" stroke-width="1.4" stroke-linecap="round"/>
            <circle cx="119" cy="152" r="4"   fill="#e02828"/>
            <circle cx="119" cy="119" r="3.5" fill="#e02828" stroke="#e8e0d0" stroke-width="1"/>
            <!-- Counter-weight tail -->
            <line x1="119" y1="152" x2="119" y2="166" stroke="#e02828" stroke-width="2.5" stroke-linecap="round"/>
          </g>
        </svg>
      </div>

      <!-- 8: Sapphire crystal -->
      <div class="watch-layer" id="layer-crystal">
        <svg width="238" height="238" viewBox="0 0 238 238" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="119" cy="119" r="108" fill="url(#crystalGrad)" stroke="#9aa0b8" stroke-width="1.2"/>
          <!-- Primary reflection -->
          <ellipse cx="77"  cy="70" rx="30" ry="11" fill="white" opacity=".09"
                   transform="rotate(-35 77 70)"/>
          <ellipse cx="92"  cy="54" rx="15" ry="5"  fill="white" opacity=".14"
                   transform="rotate(-35 92 54)"/>
          <!-- Edge glint -->
          <path d="M 40 95 Q 30 119 40 143" stroke="white" stroke-width="1.5" fill="none" opacity=".06"/>
          <defs>
            <radialGradient id="crystalGrad" cx="33%" cy="28%" r="74%">
              <stop offset="0%"   stop-color="white" stop-opacity=".09"/>
              <stop offset="70%"  stop-color="white" stop-opacity=".02"/>
              <stop offset="100%" stop-color="white" stop-opacity=".04"/>
            </radialGradient>
          </defs>
        </svg>
      </div>

      <!-- 9: Bezel -->
      <div class="watch-layer" id="layer-bezel">
        <svg width="278" height="278" viewBox="0 0 278 278" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="139" cy="139" r="135" fill="url(#bezelGrad)" stroke="#666678" stroke-width="1.5"/>
          <circle cx="139" cy="139" r="120" fill="none" stroke="#777788" stroke-width=".8"/>
          <!-- Fluting generated in JS -->
          <g id="bezel-flutes" stroke="#9a9aaa" stroke-width=".8" opacity=".45"></g>
          <!-- 12 o'clock pip -->
          <circle cx="139" cy="9" r="4" fill="#c9a84c"/>
          <defs>
            <radialGradient id="bezelGrad" cx="28%" cy="22%" r="82%">
              <stop offset="0%"   stop-color="#6a6a7e"/>
              <stop offset="45%"  stop-color="#30303e"/>
              <stop offset="100%" stop-color="#1a1a24"/>
            </radialGradient>
          </defs>
        </svg>
      </div>

      <!-- 10: Crown -->
      <div class="watch-layer" id="layer-crown">
        <svg width="340" height="340" viewBox="0 0 340 340" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Tube -->
          <rect x="295" y="162" width="10" height="16" rx="2" fill="#303040" stroke="#555568" stroke-width=".8"/>
          <!-- Crown body -->
          <rect x="305" y="155" width="30" height="30" rx="7" fill="url(#crownGrad)" stroke="#777788" stroke-width="1.2"/>
          <!-- Ridges -->
          <line x1="309" y1="160" x2="331" y2="160" stroke="#aab0c8" stroke-width=".9" opacity=".7"/>
          <line x1="309" y1="164" x2="331" y2="164" stroke="#aab0c8" stroke-width=".9" opacity=".7"/>
          <line x1="309" y1="168" x2="331" y2="168" stroke="#aab0c8" stroke-width=".9" opacity=".7"/>
          <line x1="309" y1="172" x2="331" y2="172" stroke="#aab0c8" stroke-width=".9" opacity=".7"/>
          <line x1="309" y1="176" x2="331" y2="176" stroke="#aab0c8" stroke-width=".9" opacity=".7"/>
          <line x1="309" y1="180" x2="331" y2="180" stroke="#aab0c8" stroke-width=".9" opacity=".7"/>
          <!-- Logo pip -->
          <circle cx="320" cy="170" r="3.5" fill="none" stroke="#c9a84c" stroke-width="1"/>
          <defs>
            <linearGradient id="crownGrad" x1="305" y1="170" x2="335" y2="170" gradientUnits="userSpaceOnUse">
              <stop offset="0%"   stop-color="#3a3a4a"/>
              <stop offset="35%"  stop-color="#707080"/>
              <stop offset="70%"  stop-color="#454555"/>
              <stop offset="100%" stop-color="#252530"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <!-- 11: Bottom strap -->
      <div class="watch-layer" id="layer-strap-bottom">
        <svg width="340" height="380" viewBox="0 0 340 380" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 146 268 L 144 340 Q 143 350 152 351 L 188 351 Q 197 350 196 340 L 194 268 Z"
                fill="url(#strapGrad)" stroke="#3a2010" stroke-width="1.2"/>
          <!-- Stitching -->
          <line x1="152" y1="278" x2="188" y2="278" stroke="#5a3818" stroke-width=".7" stroke-dasharray="4 3"/>
          <line x1="152" y1="292" x2="188" y2="292" stroke="#5a3818" stroke-width=".7" stroke-dasharray="4 3"/>
          <line x1="152" y1="306" x2="188" y2="306" stroke="#5a3818" stroke-width=".7" stroke-dasharray="4 3"/>
          <line x1="152" y1="320" x2="188" y2="320" stroke="#5a3818" stroke-width=".7" stroke-dasharray="4 3"/>
          <!-- Holes -->
          <circle cx="170" cy="332" r="2.5" fill="#100a04"/>
          <circle cx="170" cy="340" r="2.5" fill="#100a04"/>
          <!-- Buckle -->
          <rect x="152" y="350" width="36" height="18" rx="4" fill="#282838" stroke="#4a4a58" stroke-width="1.2"/>
          <rect x="158" y="353" width="24" height="12" rx="2" fill="none" stroke="#666678" stroke-width=".8"/>
          <line x1="165" y1="353" x2="165" y2="365" stroke="#888898" stroke-width="1.2"/>
          <defs>
            <linearGradient id="strapGrad" x1="146" y1="268" x2="194" y2="268" gradientUnits="userSpaceOnUse">
              <stop offset="0%"   stop-color="#1a0e08"/>
              <stop offset="50%"  stop-color="#281408"/>
              <stop offset="100%" stop-color="#1a0e08"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <!-- 12: Top strap -->
      <div class="watch-layer" id="layer-strap-top">
        <svg width="340" height="380" viewBox="0 0 340 380" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 146 112 L 144 40 Q 143 30 152 29 L 188 29 Q 197 30 196 40 L 194 112 Z"
                fill="url(#strapGrad2)" stroke="#3a2010" stroke-width="1.2"/>
          <!-- Stitching -->
          <line x1="152" y1="100" x2="188" y2="100" stroke="#5a3818" stroke-width=".7" stroke-dasharray="4 3"/>
          <line x1="152" y1="86"  x2="188" y2="86"  stroke="#5a3818" stroke-width=".7" stroke-dasharray="4 3"/>
          <line x1="152" y1="72"  x2="188" y2="72"  stroke="#5a3818" stroke-width=".7" stroke-dasharray="4 3"/>
          <line x1="152" y1="58"  x2="188" y2="58"  stroke="#5a3818" stroke-width=".7" stroke-dasharray="4 3"/>
          <line x1="152" y1="44"  x2="188" y2="44"  stroke="#5a3818" stroke-width=".7" stroke-dasharray="4 3"/>
          <defs>
            <linearGradient id="strapGrad2" x1="146" y1="0" x2="194" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0%"   stop-color="#1a0e08"/>
              <stop offset="50%"  stop-color="#281408"/>
              <stop offset="100%" stop-color="#1a0e08"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

    </div><!-- /watch-wrap -->

    <!-- UI overlays -->
    <div id="hero-text">
      <h1>Chronos</h1>
      <p>Scroll to reveal the mechanism</p>
    </div>

    <div id="scroll-hint">
      <span>Scroll</span>
      <div class="arrow"></div>
    </div>

    <div id="part-label">
      <div class="label-line"></div>
      <div class="label-name"></div>
      <div class="label-desc"></div>
    </div>

    <div id="part-counter"></div>

  </div><!-- /stage -->
</div><!-- /scroll-track -->

<script src="app.js"></script>
</body>
</html>
