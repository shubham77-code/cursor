<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NewsTOP AI</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div>
        <p class="eyebrow">AI-only short updates</p>
        <h1>NewsTOP AI</h1>
      </div>
      <button id="refreshBtn" aria-label="Refresh news">Refresh</button>
    </header>

    <main>
      <section id="feed" class="feed" aria-live="polite"></section>
    </main>

    <template id="newsCardTemplate">
      <article class="card">
        <div class="card-meta">
          <span class="source"></span>
          <time class="time"></time>
        </div>
        <h2 class="title"></h2>
        <p class="summary"></p>
        <div class="tags"></div>
        <a class="read-more" target="_blank" rel="noreferrer noopener">Read more</a>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
